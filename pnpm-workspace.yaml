packages:
  - packages/*
  - docs
  - play
  - internal/*

catalog:
  '@ctrl/tinycolor': ^3.4.1
  '@element-plus/icons-vue': ^2.3.2
  '@floating-ui/dom': ^1.0.1
  '@popperjs/core': npm:@sxzz/popperjs-es@^2.11.7
  '@vitejs/plugin-vue': ^5.1.4
  '@vitejs/plugin-vue-jsx': ^4.0.1
  '@vue/server-renderer': ^3.5.22
  '@vue/shared': ^3.5.22
  '@vue/test-utils': ^2.4.6
  '@vueuse/core': ^10.11.0
  lodash-unified: ^1.0.3
  normalize-wheel-es: ^1.2.0
  vue: ^3.5.22
  # vitest: ^2.0.5

onlyBuiltDependencies:
  - '@parcel/watcher'
  - es5-ext
  - esbuild
  - fsevents
  - puppeteer
  - vue-demi

overrides:
  jwa: ^1.4.2 # 20697
  typescript: $typescript

patchedDependencies:
  async-validator@4.2.5: patches/async-validator@4.2.5.patch #16757

peerDependencyRules:
  ignoreMissing:
    - vite
    - react
    - react-dom

# 强制将依赖提升到 node_modules 根目录
# 注意：这破坏了 pnpm 的严格依赖隔离机制，可能引起依赖冲突
# 仅用于兼容某些期望依赖在根目录的工具
shamefullyHoist: true

# 使用 pnpm 的 shell 模拟器而非系统 shell
# 用于跨平台兼容性，确保脚本在不同操作系统上都能正确执行
shellEmulator: true

# 禁用严格的 peer dependencies 检查
# 允许安装不符合 peer dependencies 规范的依赖包
# 注意：可能导致运行时依赖冲突，仅用于开发调试或兼容性处理
strictPeerDependencies: false
